<title>세아·찌안 동물농장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
/*
VOICE: 다섯 살 둘이 손가락으로 노는 그림책. 글자 없이 눌러보면 뭔가 일어나는 세계
PICTURE: 큰 머리·짧은 몸의 동물 6마리와 아이 2명, 그림판 이젤과 우체통이 있는 농장
COLOUR and TYPE: 하늘색·풀색 바탕, 헛간 빨강과 해 노랑 포인트 / Jua
LAYOUT: 화면 전체가 농장, 아래 직각 버튼 줄, 직각 패널. 모서리는 어디에도 둥글리지 않음
*/
:root{color-scheme:light dark;--sky:light-dark(#bfe2ee,#20335a);--sky2:light-dark(#eef7f2,#3b4c7a);--g1:light-dark(#c7e6a8,#356f3d);--g2:light-dark(#b2da92,#285a30);--ink:#9a7c63;--ink2:#2b2118;--bar:light-dark(#fff8e7,#1c1a16);--paper:light-dark(#fff8e7,#22201a);--fg:light-dark(#2b2118,#f5ecd9);--line:light-dark(#2b2118,#f5ecd9);--scrim:light-dark(rgba(43,33,24,.5),rgba(0,0,0,.65));--muted:light-dark(#7a6a58,#bfb29c);--sea:#ff4f86;--jian:#1fa3e0;--hot:#ffd23f;--red:#ef8f86;--ok:#3f9b3a}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
textarea{user-select:text;-webkit-user-select:text}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:Jua,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--sky);color:var(--fg);display:flex;flex-direction:column;height:100%;touch-action:manipulation}
button{font:inherit;color:var(--ink)}
#stage{position:relative;flex:1;overflow:hidden;background:linear-gradient(var(--sky) 0,var(--sky2) 40%,var(--g1) 42%,var(--g2) 100%)}
svg{display:block;overflow:visible}
.anc{position:absolute;transform:translate(-50%,-100%)}
.anc>svg,.thing>svg{width:100%;height:auto}
.deco{pointer-events:none}.tap{cursor:pointer}
#hills{position:absolute;left:0;top:24%;width:100%;height:19%;pointer-events:none}
#fence{position:absolute;left:0;top:41.5%;width:100%;height:8%;pointer-events:none}
#sun{position:absolute;right:calc(4% + 54px);top:4%;width:clamp(60px,12vmin,104px);cursor:pointer}
#sun .rays{transform-origin:50px 50px}
#sun.spin{animation:hop .6s}
@keyframes turn{to{transform:rotate(360deg)}}
.cloud{position:absolute;width:clamp(80px,17vmin,160px);pointer-events:none;animation:drift 180s linear infinite}
@keyframes drift{from{transform:translateX(-35vw)}to{transform:translateX(135vw)}}
.bird{position:absolute;width:26px;pointer-events:none;animation:drift 110s linear infinite}
.bird path{animation:flap 1.4s ease-in-out infinite alternate;transform-origin:center;transform-box:fill-box}
@keyframes flap{to{transform:scaleY(.4)}}
#blades{transform-origin:60px 52px;animation:turn 40s linear infinite}
#mill.fast #blades{animation-duration:.8s}
#tree.shake{animation:shake .5s}
@keyframes shake{25%{transform:translate(-52%,-100%) rotate(-2deg)}75%{transform:translate(-48%,-100%) rotate(2deg)}}
.leaf{animation:sway 4s ease-in-out infinite alternate;transform-origin:80px 150px}
@keyframes sway{to{transform:rotate(1.2deg)}}
.dl,.dr{transition:transform .5s ease}
#barn.open .dl,#barn.open .dr{transform:scaleX(.12)}
#cat{transition:transform .5s ease .2s;transform:translateY(40px)}
#barn.open #cat{transform:translateY(0)}
#flag{transition:transform .5s cubic-bezier(.5,1.8,.5,1);transform-origin:63px 42px;transform:rotate(90deg)}
#mailbox.up #flag{transform:rotate(0)}
.thing{position:absolute;transform:translate(-50%,-100%);cursor:pointer;transition:left 1.8s ease-in-out,top 1.8s ease-in-out}
.animal{width:clamp(70px,16vmin,148px)}
.kid{width:clamp(54px,12vmin,104px)}
.sh{fill:rgba(30,40,10,.18)}
.eye{animation:blink 4.6s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.tail{animation:wag 1.6s ease-in-out infinite alternate;transform-box:fill-box}
@keyframes wag{from{transform:rotate(-10deg)}to{transform:rotate(10deg)}}
.breath{animation:breath 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
@keyframes breath{50%{transform:scaleY(1.03)}}
.ear{animation:ear 5s ease-in-out infinite;transform-box:fill-box}
@keyframes ear{0%,88%,100%{transform:rotate(0)}93%{transform:rotate(-14deg)}}
.kid .flip{transform-box:fill-box;transform-origin:center}
.kid.left .flip{transform:scaleX(-1)}
.kid.mine::after{content:"";position:absolute;left:50%;top:-16px;width:14px;height:14px;background:#ffe9a6;transform:translateX(-50%) rotate(45deg);border:2px solid var(--ink);opacity:.85}
.kid.walk svg{animation:bob .4s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-2.5%)}}
.hop>svg{animation:hop .5s ease;transform-origin:bottom}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-20%) scaleY(1.05)}70%{transform:translateY(0) scaleY(.93)}}
.munch>svg{animation:munch .16s ease 5 alternate;transform-origin:bottom}
@keyframes munch{to{transform:scale(1.05,.95)}}
.spinf{animation:spinf .7s ease}
@keyframes spinf{50%{transform:translate(-50%,-100%) rotate(180deg) scale(1.4)}100%{transform:translate(-50%,-100%) rotate(360deg)}}
.bubble.snd{background:none;border:0;box-shadow:none;padding:0;font-size:clamp(13px,2.6vmin,19px);font-weight:800;color:#8a6450;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff}
.bubble{position:absolute;transform:translate(-50%,-100%);background:#fff;color:var(--ink);border:3px solid var(--ink);padding:4px 12px;font-size:clamp(20px,4.5vmin,34px);white-space:nowrap;pointer-events:none;z-index:200;animation:pop 1.5s ease forwards}
@keyframes pop{0%{opacity:0;margin-top:10px}15%{opacity:1;margin-top:0}80%{opacity:1}100%{opacity:0;margin-top:-14px}}
.fx{position:absolute;pointer-events:none;z-index:150;transform:translate(-50%,-50%)}
.heart{width:34px;animation:float 1.3s ease-out forwards}
.spark{width:28px;animation:float 1s ease-out forwards}
@keyframes float{from{opacity:1;transform:translate(-50%,0) scale(.6)}to{opacity:0;transform:translate(calc(-50% + var(--dx)),-110px) scale(1.2)}}
.ripple{width:90px;animation:rip 1s ease-out forwards}
@keyframes rip{from{opacity:.9;transform:translate(-50%,-50%) scale(.2)}to{opacity:0;transform:translate(-50%,-50%) scale(1.6)}}
.fish{width:46px;animation:jump 1.1s ease-in-out forwards}
@keyframes jump{0%{transform:translate(-50%,0) rotate(-40deg);opacity:0}15%{opacity:1}50%{transform:translate(-10%,-90px) rotate(10deg)}100%{transform:translate(30%,0) rotate(70deg);opacity:0}}
.pick{position:absolute;transform:translate(-50%,-100%);cursor:pointer;z-index:120}
.egg{width:clamp(30px,6vmin,46px);animation:lay .4s ease}
.apple{width:clamp(28px,5.5vmin,42px);animation:fall .7s cubic-bezier(.5,0,1,1)}
@keyframes lay{from{transform:translate(-50%,-100%) scale(0)}}
@keyframes fall{from{margin-top:calc(-1 * var(--h))}80%{margin-top:0}90%{margin-top:-10px}}
.got{transition:all .6s ease-in;left:12%!important;top:4%!important;opacity:0}
.fly{position:absolute;width:34px;cursor:pointer;z-index:110}
.fly .w{animation:wing 1.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes wing{to{transform:scaleX(.25)}}
.mbadge{position:absolute;right:-6px;top:-6px;background:var(--red);color:#fff;font-size:16px;min-width:26px;height:26px;line-height:22px;text-align:center;border:2px solid var(--ink);pointer-events:none}

#bar{display:flex;gap:8px;align-items:stretch;padding:8px max(8px,env(safe-area-inset-left,0px)) 8px max(8px,env(safe-area-inset-right,0px));background:var(--bar);border-top:4px solid var(--ink);overflow-x:auto;flex:none}
.btn{flex:none;width:64px;height:64px;border:3px solid var(--ink);background:#fff;padding:4px;cursor:pointer;display:grid;place-items:center;position:relative}
.btn svg{width:100%;height:100%}
.btn.on{background:var(--hot);transform:translateY(-4px);box-shadow:0 4px 0 var(--ink)}
.btn.off{opacity:.4}
.btn:focus-visible,.ib:focus-visible,.txtbtn:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.btn .badge{position:absolute;right:-3px;top:-3px;background:var(--red);color:#fff;font-size:14px;min-width:22px;height:22px;line-height:20px;text-align:center;border:2px solid var(--ink)}
.sep{flex:none;width:3px;background:var(--line);opacity:.25;margin:4px 2px}
#friends{position:absolute;left:max(8px,env(safe-area-inset-left,0px));top:58px;display:flex;gap:4px;z-index:250;flex-wrap:wrap;max-width:60vw}
#friends button{width:44px;height:44px;padding:0;border:3px solid var(--ink);background:#fff;cursor:pointer;position:relative}
#friends button svg{width:100%;height:100%}
#friends button::after{content:"";position:absolute;right:-4px;bottom:-4px;width:12px;height:12px;background:#3f9b3a;border:2px solid #fff;border-radius:50%!important}
@media(max-width:600px){#friends{top:48px}#friends button{width:36px;height:36px}}
#counts{position:absolute;left:max(8px,env(safe-area-inset-left,0px));top:8px;display:flex;gap:2px;background:#fff;border:3px solid var(--ink);z-index:250;color:var(--ink)}
.count{display:flex;align-items:center;gap:3px;font-size:24px;padding:0 6px}
.count svg{width:30px;height:30px}
.count.bump{animation:hop .4s}
#momzone{position:absolute;right:env(safe-area-inset-right,0px);top:0;width:58px;height:58px;z-index:300;display:grid;place-items:center;touch-action:none}
#momzone svg{width:34px;height:34px;opacity:.35}
#momzone.hold svg{opacity:1}
#momzone .ring{transform:rotate(-90deg);transform-origin:20px 20px}
#momzone.hold .ring{animation:fillring 3s linear forwards}
@keyframes fillring{to{stroke-dashoffset:0}}

/* 오버레이 */
.ov{position:fixed;inset:0;z-index:1000;background:var(--paper);color:var(--fg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ov.center{align-items:center;justify-content:center;background:var(--scrim);padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.ovtop{display:flex;gap:8px;align-items:center;padding:8px max(10px,env(safe-area-inset-right,0px)) 8px max(10px,env(safe-area-inset-left,0px));border-bottom:4px solid var(--ink);background:var(--bar);flex:none}
.ovbody{flex:1;overflow:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.box{background:var(--paper);color:var(--fg);border:4px solid var(--line);box-shadow:0 6px 18px rgba(90,60,30,.18);padding:16px;width:min(560px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.ib{flex:none;width:var(--b,52px);height:var(--b,52px);border:3px solid var(--ink);background:#fff;padding:5px;cursor:pointer;display:grid;place-items:center;position:relative}
.ib svg{width:100%;height:100%}
.ib.on{background:var(--hot);box-shadow:0 0 0 3px var(--line)}
.ib.sw.on{box-shadow:inset 0 0 0 5px #fff,inset 0 0 0 8px var(--ink),0 0 0 3px var(--line)}
.ib.armed{background:#ffd0cc;animation:hop .4s}
.ib.big{--b:76px}
.ib[disabled]{opacity:.4}
.txtbtn{border:3px solid var(--ink);background:#fff;padding:10px 14px;font-size:18px;cursor:pointer;min-height:48px}
.txtbtn.primary{background:var(--hot)}
.txtbtn.warn{background:#ffd0cc}
.txtbtn[disabled]{opacity:.45;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.card{border:3px solid var(--ink);background:#fff;padding:6px;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:4px}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;border:2px solid var(--ink);background:#fff}
.card .who{position:absolute;left:-8px;top:-10px;width:44px;height:44px;background:#fff;border:3px solid var(--ink)}
.card .done{position:absolute;right:-8px;top:-10px;width:36px;height:36px;background:var(--ok);border:3px solid var(--ink)}
.empty{display:grid;place-items:center;gap:10px;padding:40px 12px;color:var(--muted);text-align:center;font-size:18px}
.empty svg{width:120px;opacity:.8}

/* 고르기 */
.pickrow{display:flex;gap:clamp(16px,5vw,48px);flex-wrap:wrap;justify-content:center}
.bigkid{width:clamp(130px,36vmin,240px);border:4px solid var(--ink);background:#fff;padding:12px 12px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:clamp(24px,5vmin,36px);box-shadow:0 6px 18px rgba(90,60,30,.18)}
.bigkid svg{width:100%}
.bigkid:active{transform:translate(3px,3px);box-shadow:0 3px 9px rgba(90,60,30,.18)}

/* 옷장 */
.wcard{border:3px solid var(--ink);background:#fff;padding:8px;cursor:pointer;display:grid;place-items:center}
.wcard svg{height:clamp(120px,26vmin,190px);width:auto}
.wcard.on{background:var(--hot);box-shadow:0 0 0 4px var(--line)}
.swrow{display:flex;gap:8px;flex-wrap:wrap;padding-top:14px}
.swrow button{width:48px;height:48px;border:3px solid var(--ink);cursor:pointer;padding:0}
.swrow button.on{box-shadow:inset 0 0 0 5px #fff,0 0 0 3px var(--line)}

/* 그림판 */
#ov-easel{display:grid;grid-template-rows:1fr auto;grid-template-columns:100%}
#pw{position:relative;display:grid;place-items:center;overflow:hidden;background:repeating-linear-gradient(45deg,var(--paper) 0 14px,var(--bar) 14px 28px)}
#paper{position:relative;background:#fff;border:4px solid var(--ink);box-shadow:0 6px 18px rgba(90,60,30,.18);touch-action:none;cursor:crosshair}
#paper canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#paper canvas.mine{z-index:2}
#pcur{position:absolute;width:40px;height:40px;transform:translate(-50%,-110%);z-index:5;pointer-events:none;transition:left .08s linear,top .08s linear;background:#fff;border:3px solid var(--ink)}
#etools{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:8px max(8px,env(safe-area-inset-right,0px)) 8px max(8px,env(safe-area-inset-left,0px));background:var(--bar);border-top:4px solid var(--ink)}
#etools .ib{--b:46px}
#etools .gap{width:3px;align-self:stretch;background:var(--line);opacity:.25}
.partner{background:#fff}
@media (orientation:landscape) and (min-width:600px){
 #ov-easel{grid-template-rows:100%;grid-template-columns:auto 1fr}
 #etools{order:-1;display:grid;grid-template-columns:repeat(2,46px);align-content:start;border-top:0;border-right:4px solid var(--ink);overflow-y:auto;padding:8px 8px 8px max(8px,env(safe-area-inset-left,0px))}
 #etools .gap{display:none}
}
@media (orientation:landscape) and (min-width:600px) and (max-height:520px){#etools{grid-template-columns:repeat(3,42px)}#etools .ib{--b:42px}}

/* 편지 */
.mbtn{display:flex;align-items:center;gap:6px;border-radius:16px}.mbtn svg{width:30px;height:30px}.mbtn.warn{background:#ffe1dc}
.card .new{position:absolute;right:-6px;top:-8px;width:22px;height:22px;border-radius:50%;background:#ff8fab;border:3px solid var(--ink)}
.card .to{position:absolute;left:-6px;bottom:-8px;width:34px;height:34px;background:#fff;border:3px solid var(--ink);border-radius:50%;overflow:hidden}
#lto{gap:6px;align-items:flex-start;flex-wrap:wrap}#lto .tow{display:flex;flex-direction:column;align-items:center;gap:2px}#lto .tow span{font-size:14px;color:var(--ink);white-space:nowrap}#lto .tob{width:52px;height:52px;padding:2px;border:3px solid var(--ink);background:#fff;border-radius:50%;cursor:pointer;overflow:hidden;opacity:.55}
#lto .tob.on{opacity:1;background:#fff3c4;box-shadow:0 0 0 3px #ffd23f}#lto .tob.all{width:auto;border-radius:26px;padding:0 14px;font-size:18px}
.lrow{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.lrow img{width:min(260px,100%);border:3px solid var(--ink);background:#fff}
#ltext,#pmsg{width:100%;min-height:96px;font:inherit;font-size:22px;padding:10px;border:3px solid var(--ink);background:#fff;color:var(--ink);resize:vertical}
#lpart{color:var(--muted);font-size:20px;min-height:1.3em}
.mic.on{background:#ffd0cc;animation:hop 1s infinite}
.fly-env{position:fixed;z-index:2000;width:80px;pointer-events:none;animation:envfly 1.2s ease-in forwards}
@keyframes envfly{0%{transform:translate(-50%,-50%) scale(1.4)}60%{transform:translate(-50%,-50%) scale(1)}100%{transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(.3);opacity:.2}}

/* 엄마 */
.gate{width:min(380px,100%);align-items:center;text-align:center}
.gq{font-size:40px;margin:0}
.ga{font-size:34px;min-height:44px;min-width:120px;border-bottom:4px solid var(--line);margin:0}
.keys{display:grid;grid-template-columns:repeat(3,72px);gap:8px}
.keys button{height:60px;border:3px solid var(--ink);background:#fff;font-size:28px;cursor:pointer}
.shakex{animation:shx .4s}
@keyframes shx{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.mom h2{margin:0;font-size:26px;font-weight:400}
.mom h3{margin:8px 0 0;font-size:20px;font-weight:400;border-bottom:3px solid var(--line);padding-bottom:4px}
.mom p{margin:0;line-height:1.5;font-size:16px;color:var(--muted)}
.mrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.kidbtn{display:flex;align-items:center;gap:6px}
.kidbtn svg{width:36px;height:36px}
.kidbtn.on{background:var(--hot)}
.litem{display:grid;grid-template-columns:110px 1fr;gap:10px;border:3px solid var(--line);padding:8px;background:var(--bar)}
.litem img{width:110px;aspect-ratio:4/3;object-fit:cover;border:2px solid var(--ink);background:#fff}
.litem .meta{font-size:15px;color:var(--muted)}
.litem .tx{font-size:18px;word-break:break-word;white-space:pre-wrap}
.litem .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.status{font-size:16px;line-height:1.5;min-height:1.5em}
.status.bad{color:var(--red)}.status.good{color:var(--ok)}
.cnt{font-size:15px;color:var(--muted);text-align:right}
.cnt.over{color:var(--red)}
#vimg{width:min(720px,100%);border:4px solid var(--ink);background:#fff}
#vtext{font-size:24px;margin:0;white-space:pre-wrap;word-break:break-word}
.nametag{position:absolute;left:50%;top:100%;transform:translate(-50%,-3px);background:#fff;color:var(--ink);border:2px solid var(--ink);font-size:clamp(12px,2.6vmin,18px);line-height:1.25;padding:0 6px;white-space:nowrap;pointer-events:none}
.kid.mine .nametag{background:var(--hot)}
/* 아기 */
.chickp{width:clamp(22px,4.4vmin,40px);transition:left 2.4s ease-in-out,top 2.4s ease-in-out}.chickp.left svg{transform:scaleX(-1)}
.kid.baby.twin{width:clamp(90px,20vmin,172px)}
.kid.baby{width:clamp(50px,11vmin,96px);transition:left 3.2s ease-in-out,top 3.2s ease-in-out}
.kid.baby.walk svg{animation:crawl .6s ease-in-out infinite alternate}
@keyframes crawl{from{transform:rotate(-3deg) translateY(0)}to{transform:rotate(3deg) translateY(-3%)}}
.kid.baby.mine::after{top:-12px}
#ov-pick .pickrow{max-height:100%;overflow:auto;padding:8px}
.bigkid{width:clamp(96px,22vmin,170px);font-size:clamp(20px,4vmin,30px);padding:8px 8px 4px}
/* 가게 */
.scard{border:3px solid var(--ink);background:#fff;padding:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;color:var(--ink)}
.scard svg.pv{height:clamp(90px,20vmin,150px);width:auto}
.scard.owned{background:#e6f7df}
.scard.cant{opacity:.55}
.wmore{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#8a6450;font-family:Jua,sans-serif}.wmore b{font-size:44px;line-height:1}.wmore span{font-size:18px}
.scard .have{font-size:17px;font-weight:900;color:#7a8a5a;background:#eef4e2;border-radius:999px;padding:2px 12px}
.stname{font-family:Jua,sans-serif;font-size:22px;margin-right:6px}
.price{display:flex;gap:8px;font-size:22px;align-items:center}
.price span{display:flex;align-items:center;gap:2px}.price svg{width:26px;height:26px}
.scard .own{position:absolute;right:-8px;top:-10px;width:36px;height:36px;background:var(--ok);border:3px solid var(--ink)}
.wcard{position:relative}
.wcard.locked{opacity:.5}

const pickN=(a,n)=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b.slice(0,n)};
const iey=w=>{const c=w.charCodeAt(w.length-1)-0xAC00;return w+(c>=0&&c<11172&&c%28?'이에요':'예요')};
function openLearn(g){if(!myKid)return;lStar=+LS.get('farmStar_'+myKid,0)||0;if(g)lg=g;OVS.forEach(id=>{if(id!=='ov-learn'&&id!=='ov-pick')hide(id)});show('ov-learn');newQuiz()}
function renderStars(){$('lstars').innerHTML=Array.from({length:3},(_,i)=>`<span class="${i<lStar%3?'':'off'}">${SPARK}</span>`).join('')}
function newQuiz(){lLock=false;$('ltabs').innerHTML=LGAMES.map(([id,t])=>`<button class="txtbtn ltab${lg===id?' primary':''}" data-lg="${id}">${t}</button>`).join('');renderStars();
 let top='',opts='';
 if(lg==='sound'){const ch=pickN(ANIMALS.filter(a=>SNDF[a.id]),3);lAns=ch[0].id;
  top=`<button class="ib" id="qplay" aria-label="다시 듣기" style="--b:110px">${ICON.speaker}</button>`;
  opts=pickN(ch,3).map(a=>`<button class="qbtn" data-q="${a.id}" aria-label="${a.name}">${a.svg}<span>${a.name}</span></button>`).join('');
  setTimeout(()=>{if(!$('ov-learn').hidden&&lg==='sound')playQ()},450)}
 else if(lg==='math'){const L=lvl(),max=[4,10,15,20,30][L],plus=L===0||Math.random()<.55;let a,b;
  if(plus){const lo=[1,1,2,4,6][L];a=rnd(lo,max-lo);b=rnd(Math.min(lo,max-a),max-a)}
  else{a=rnd([2,3,6,10,14][L],max);b=rnd(1,Math.min(a-1,[2,5,9,12,20][L]))}
  lAns=plus?a+b:a-b;const ap=FOODS[3].svg,gone=ap.replace('<svg ','<svg style="opacity:.25" '),pics=a<=10&&(plus?b<=10:true);
  top=`${pics?`<div class="qeq"><div class="qitems">${Array.from({length:a},(_,i)=>!plus&&i>=a-b?gone:ap).join('')}</div>${plus?`<span class="qop">+</span><div class="qitems">${Array.from({length:b},()=>ap).join('')}</div>`:''}</div>`:''}<div class="qword">${a} ${plus?'+':'−'} ${b} = ?</div>`;
  opts=numOpts(lAns,max)}
 else if(lg==='count'){const L=lvl(),n=rnd([1,4,7,10,13][L],[4,10,15,20,30][L]);lAns=n;const IT=[[FOODS[3].svg,'사과'],[FOODS[0].svg,'당근'],[FOODS[1].svg,'옥수수'],[EGG,'달걀'],[flower('#ff8fab'),'꽃'],[HEART,'하트']];const[t1,t2]=pickN(IT,2);
  const other=L===0?0:rnd([0,2,4,6,8][L],[0,5,8,10,12][L]),all=pickN([...Array(n).fill(t1[0]),...Array(other).fill(t2[0])],n+other);
  top=`${other?`<div class="qask">${t1[0].replace('<svg','<svg style="width:40px;height:40px"')}<b>${t1[1]}</b>${(c=>c>=0&&c<11172&&c%28?'은':'는')(t1[1].charCodeAt(t1[1].length-1)-0xAC00)} 몇 개일까?</div>`:''}<div class="qitems qcnt">${all.join('')}</div>`;opts=numOpts(n,30)}
 else if(lg==='eng'){const L=lvl(),ch=pickN(ENG,L>=2?4:3),[id,w]=ch[0];
  if(L>=3&&Math.random()<.5&&w.length>=3){const i=rnd(0,w.length-1),ab='abcdefghijklmnopqrstuvwxyz',set=new Set([w[i]]);while(set.size<4)set.add(ab[rnd(0,25)]);lAns=w[i];
   top=`<div class="qbig">${engPic(id)}</div><div class="qword qeng">${w.slice(0,i)}<u>?</u>${w.slice(i+1)}</div>`;
   opts=pickN([...set],4).map(c=>`<button class="qbtn" data-q="${c}"><span class="n qeng">${c}</span></button>`).join('')}
  else{lAns=w;top=`<div class="qbig">${engPic(id)}</div>`;
   opts=pickN(ch,ch.length).map(([,x])=>`<button class="qbtn" data-q="${x}" style="min-height:80px"><span class="n qeng" style="font-size:clamp(26px,6vmin,44px)">${x}</span></button>`).join('')}}
 else{const ch=pickN(ANIMALS,Math.min(ANIMALS.length,nOpts()));lAns=ch[0].id;
  top=`<div class="qbig">${ch[0].svg}</div>`;
  opts=pickN(ch,ch.length).map(a=>`<button class="qbtn" data-q="${a.id}" style="min-height:80px"><span class="n" style="font-size:clamp(30px,7vmin,52px)">${a.name}</span></button>`).join('')}
 if(lg==='co'){renderCo();return}
 $('lbody').innerHTML=`<div class="qwrap"><div class="qtop">${top}</div><div class="qfb" id="qfb"></div><div class="qopts">${opts}</div></div>`;
 const qp=$('qplay');if(qp)qp.addEventListener('click',playQ)}
function playQ(){animalSound(lAns);hop($('qplay'))}
const SUNI=`<svg viewBox="0 0 60 60"><g stroke="#f4a300" stroke-width="4" stroke-linecap="round"><path d="M30 4v8M30 48v8M4 30h8M48 30h8M11 11l6 6M43 43l6 6M11 49l6-6M43 17l6-6"/></g><circle cx="30" cy="30" r="14" fill="#ffd23f" ${S}/></svg>`,STARI=`<svg viewBox="0 0 60 60"><path d="M30 4l7.6 16.6 18 2-13.4 12.2 3.8 17.8L30 43.6 14 52.6l3.8-17.8L4.4 22.6l18-2z" fill="#ffd23f" ${S}/></svg>`;
function engPic(id){if(id.startsWith('f:'))return FOODS.find(f=>f.id===id.slice(2)).svg;if(id==='x:egg')return EGG;if(id==='x:heart')return HEART;if(id==='x:flower')return flower('#ff8fab');if(id==='x:sun')return SUNI;if(id==='x:star')return STARI;return (ANIMALS.find(a=>a.id===id)||FRIENDS.find(a=>a.id===id)).svg}
$('ltabs').addEventListener('click',e=>{const b=e.target.closest('[data-lg]');if(!b)return;lg=b.dataset.lg;sfx('tap',.5);newQuiz()});
$('lbody').addEventListener('click',e=>{const b=e.target.closest('[data-q]');if(!b||lLock)return;if(lg==='co'){coAnswer(b);return}const ok=String(lAns)===b.dataset.q,fb=$('qfb');
 if(ok){lLock=true;b.classList.add('right');sfx('yay',.45);
  const nm=lg==='count'||lg==='math'?lAns+', '+(KNUM[lAns]||''):lg==='eng'?lAns:ANIMALS.find(a=>a.id===lAns).name;fb.textContent='딩동댕! '+nm+'!';
  lStar++;LS.set('farmStar_'+myKid,lStar);renderStars();if(lStar%3===0){hearts+=1;save();bumpCount('hc',hearts);fb.textContent+=' 하트 하나!';setTimeout(()=>sfx('heart',.5),500)}
  setTimeout(()=>{if(!$('ov-learn').hidden)newQuiz()},1700);return}
 b.classList.remove('shakex');void b.offsetWidth;b.classList.add('shakex');sfx('oops',.4);
 if(lg==='sound'&&0){}else if(lg==='sound'){fb.textContent='다시 들어 볼까?';setTimeout(playQ,500)}else if(lg==='count'||lg==='math')fb.textContent=lg==='math'&&b.closest('.qopts')?'사과를 하나씩 세어 봐!':'하나씩 손가락으로 세어 봐!';else fb.textContent='다시 골라 볼까?'});
const school=place(`<svg viewBox="0 0 140 120"><ellipse class="sh" cx="70" cy="116" rx="60" ry="5"/><rect x="14" y="50" width="112" height="64" rx="6" fill="#fff6dc" ${S}/><path d="M4 56L70 20l66 36" fill="#b6dcf0" ${S}/><path d="M4 56L70 20l66 36" fill="none" stroke="${ink}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 56L70 20l66 36" fill="none" stroke="#a9cbe8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="2" width="20" height="20" rx="3" fill="#fff6dc" ${S2}/><path d="M64 22v-9a6 6 0 0 1 12 0v9" fill="#ffe39a" ${S2}/><rect x="40" y="58" width="60" height="18" rx="5" fill="#fffaf2" ${S2}/><text x="70" y="72" font-size="13" text-anchor="middle" fill="#8a6450" font-family="Jua,sans-serif">가 1 ♪ A</text><path d="M58 114V92q0 -10 12 -10q12 0 12 10v22z" fill="#e3b48e" ${S2}/><rect x="22" y="82" width="26" height="18" rx="4" fill="#cfe7f4" ${S2}/><rect x="92" y="82" width="26" height="18" rx="4" fill="#cfe7f4" ${S2}/></svg>`,104,206,'clamp(100px,21vmin,190px)','tap',206);
school.setAttribute('role','button');school.setAttribute('aria-label','배움 놀이');
school.addEventListener('click',e=>{e.stopPropagation();hop(school);sfx('bell',.5);openLearn()});

/* ===== 옥수수 밭: 씨앗 심기 → 물 주기 → 12분이면 수확 ===== */
const GROW=12*60*1000;let corn=LS.get('farmCorn',[0,0,0,0]);if(!Array.isArray(corn)||corn.length!==4)corn=[0,0,0,0];corn=corn.map(v=>+v||0);
const DROP=`<svg viewBox="0 0 30 30"><path d="M15 2q10 14 10 19a10 10 0 0 1 -20 0q0 -5 10 -19z" fill="#4cc9f0" ${S2}/></svg>`;
function cornSvg(st){const soil=`<ellipse class="sh" cx="20" cy="66" rx="17" ry="3"/><ellipse cx="20" cy="62" rx="17" ry="5" fill="#8a5a3a" ${S2}/><path d="M10 61q4 -2 8 0M23 63q4 -2 8 0" stroke="#6b4429" stroke-width="1.5" fill="none"/>`;
 if(st===0)return`<svg viewBox="0 0 40 68">${soil}<circle cx="20" cy="61" r="2.4" fill="#4a2e1c"/><path d="M20 42v10M15 47h10" stroke="#fff" stroke-width="3" opacity=".85"/></svg>`;
 if(st===1)return`<svg viewBox="0 0 40 68">${soil}<path d="M20 61v-10" stroke="#3f9b3a" stroke-width="3"/><path d="M20 53q-8 -2 -9 -8q7 0 9 6M20 51q7 -3 9 -9q-7 1 -9 7" fill="#6cc44c" ${S2}/></svg>`;
 if(st===2)return`<svg viewBox="0 0 40 68">${soil}<path d="M20 61V26" stroke="#3f9b3a" stroke-width="4"/><path d="M20 51q-12 -2 -15 -12q10 2 15 9M20 43q12 -3 15 -13q-10 2 -15 9M20 33q-8 -3 -10 -10q8 2 10 7" fill="#6cc44c" ${S2}/></svg>`;
 return`<svg viewBox="0 0 40 68">${soil}<path d="M20 61V12" stroke="#3f9b3a" stroke-width="4"/><path d="M20 12l-4 -8M20 12v-10M20 12l4 -8" stroke="#d9a73e" stroke-width="2.2" stroke-linecap="round"/><path d="M20 55q-13 -2 -16 -12q10 2 16 9M20 47q13 -3 16 -13q-10 2 -16 9" fill="#6cc44c" ${S2}/><g transform="rotate(18 27 31)"><ellipse cx="27" cy="31" rx="5" ry="10" fill="#ffd23f" ${S2}/><path d="M24 27h6M23.5 31h7M24 35h6" stroke="#e0a800" stroke-width="1.3"/></g><path d="M21 45q2 -14 12 -20q-2 12 -6 18z" fill="#7cc95e" ${S2}/></svg>`}
const cStage=t=>!t?0:Date.now()-t>=GROW?3:Date.now()-t>=GROW*.4?2:1;
place(`<svg viewBox="0 0 70 80"><ellipse class="sh" cx="35" cy="77" rx="14" ry="3"/><rect x="31" y="34" width="8" height="43" fill="#8a5a3a" ${S}/><rect x="6" y="6" width="58" height="32" fill="#f6d77a" ${S}/><g transform="translate(20 7) scale(.5)">${FOODS[1].svg.replace(/<svg[^>]*>|<\/svg>/g,'')}</g></svg>`,18,196,'clamp(36px,7vmin,62px)','deco',196);
const cornSpots=[0,1,2,3].map(i=>{const x=26+i*8,y=196+(i%2)*4,el=place(cornSvg(cStage(corn[i])),x,y,'clamp(38px,7.4vmin,64px)','tap',Math.round(y));el.setAttribute('role','button');el.setAttribute('aria-label','옥수수 밭');el.addEventListener('click',e=>{e.stopPropagation();tapCorn(i)});return el});
const watered=[0,0,0,0];
let cornAt=0;function shareCorn(){cornAt=Date.now();if(db)db.doc('corn/field').set({c:corn,at:cornAt}).catch(()=>{})}
function gotCorn(v){if(!v||!Array.isArray(v.c)||v.c.length!==4||(+v.at||0)<cornAt)return;cornAt=+v.at||0;corn=v.c.map(x=>+x||0);LS.set('farmCorn',corn);drawCorn()}
function drawCorn(){cornSpots.forEach((el,i)=>{const s=cStage(corn[i]);if(el.dataset.s!==String(s)){el.dataset.s=s;el.innerHTML=cornSvg(s)}})}
function tapCorn(i){const el=cornSpots[i],s=cStage(corn[i]);hop(el);
 if(s===0){corn[i]=Date.now();LS.set('farmCorn',corn);shareCorn();sfx('plop',.5);sayAt(el,'씨앗 심었다!');drawCorn();return}
 if(s===3){corn[i]=0;LS.set('farmCorn',corn);shareCorn();sfx('yay',.4);sparkle(el);sayAt(el,'옥수수 수확!');food='corn';renderBar();hop(bar.querySelector('[data-food=corn]'));drawCorn();return}
 if(Date.now()-watered[i]>60000){watered[i]=Date.now();corn[i]-=2*60*1000;LS.set('farmCorn',corn);shareCorn();sfx('splash',.5);for(let j=0;j<3;j++)setTimeout(()=>fxOn(el,DROP,'spark'),j*120);sayAt(el,'물 주기! 쑥쑥');drawCorn()}
 else{const m=Math.max(1,Math.ceil((GROW-(Date.now()-corn[i]))/60000));sayAt(el,m+'분 더 자라요')}}
drawCorn();setInterval(drawCorn,20000);

/* ===== 잡초 뽑기: 여기저기 자라나요. 다섯 개 뽑으면 하트 하나 ===== */
const WEED=`<svg viewBox="0 0 40 36"><ellipse class="sh" cx="20" cy="34" rx="14" ry="2.5"/><path d="M20 34q-14 -2 -17 -14q8 2 11 8q-6 -12 -2 -22q6 6 6 16q0 -14 6 -20q4 10 -1 20q4 -8 12 -10q-2 12 -15 22z" fill="#5c8f2e" ${S2}/><path d="M20 33v-12" stroke="#3d6b1c" stroke-width="2"/><circle cx="27" cy="9" r="3.4" fill="#ffd23f" ${S2}/></svg>`;
let weedN=+LS.get('farmWeed',0)||0;const weeds=new Set();
function addWeed(){if(weeds.size>=5)return;const x=6+Math.random()*(XMAX-10),y=58+Math.random()*(YMAX-62),w=document.createElement('div');w.className='pick weed';w.innerHTML=WEED;w.style.left=wx(x);w.style.top=wy(y);w.style.zIndex=Math.round(y);w.setAttribute('role','button');w.setAttribute('aria-label','잡초');world.appendChild(w);weeds.add(w);
 w.addEventListener('click',e=>{e.stopPropagation();if(w.classList.contains('out'))return;weedN++;LS.set('farmWeed',weedN);const big=weedN%10===0;sayAt(w,big?'잡초 열 개! 하트!':'쏙!');if(big){hearts++;save();bumpCount('hc',hearts);fxOn(w,HEART,'heart')}w.classList.add('out');weeds.delete(w);sfx('pop',.55,.8);setTimeout(()=>w.remove(),600)})}
for(let i=0;i<3;i++)addWeed();setInterval(()=>{if(!document.hidden)addWeed()},4*60*1000);

/* ===== 하늘 시간 ===== */
function skyTime(){const h=new Date().getHours()+new Date().getMinutes()/60,t=h>=5&&h<7?'dawn':h>=7&&h<17.5?'':h>=17.5&&h<19.5?'dusk':'night';['dawn','dusk','night'].forEach(c=>stage.classList.toggle(c,c===t))}
/* 해와 달이 시간에 맞춰 글씨로 말해요 (하루 한 번씩) */
const SKYMSG=[[7.5,'좋은 아침! 잘 잤니?'],[12,'점심 맛있게 먹어요!'],[15,'간식 먹고 물도 마셔요'],[18,'저녁 먹을 시간이야'],[21,'이제 씻고 잠옷 입자'],[21.5,'지금은 잘 시간이야']];
const nowH=()=>{const d=new Date();return d.getHours()+d.getMinutes()/60};
function skyNow(){const h=nowH();if(h>=21.5||h<5)return'지금은 잘 시간이야';let m='오늘도 신나게 놀자!';SKYMSG.forEach(([t,x])=>{if(h>=t)m=x});return m}
let skyT=0;function skySay(t,sec=8){const b=$('skysay');b.textContent=t;b.classList.add('on');sfx('ding',.35);clearTimeout(skyT);skyT=setTimeout(()=>b.classList.remove('on'),sec*1000)}
function skyTick(){skyTime();const d=new Date(),key=d.toDateString(),h=nowH(),said=LS.get('farmSky',{});if(said.d!==key){said.d=key;said.s=[]}
 const due=SKYMSG.filter(([t])=>h>=t&&h<t+.5&&!said.s.includes(t)).pop();if(due){said.s.push(due[0]);LS.set('farmSky',said);skySay(due[1],60)}}
skyTime();setInterval(skyTick,20000);setTimeout(()=>{skyTick();if(!$('skysay').classList.contains('on')&&(nowH()>=21.5||nowH()<5))skySay('지금은 잘 시간이야',10)},1500);
$('moon').addEventListener('click',e=>{e.stopPropagation();const m=e.currentTarget;m.classList.remove('spin');void m.offsetWidth;m.classList.add('spin');sparkle(m);skySay(skyNow())});
/* ===== 시작 ===== */
renderBar();
if(myKid)setKid(myKid);else{renderPick();show('ov-pick');camera(true)}
}
</script>
