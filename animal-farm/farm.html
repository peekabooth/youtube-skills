<title>세아·찌안 동물농장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
/*
VOICE: 다섯 살 둘이 손가락으로 노는 그림책. 글자 없이 눌러보면 뭔가 일어나는 세계
PICTURE: 큰 머리·짧은 몸의 동물 6마리와 아이 2명, 그림판 이젤과 우체통이 있는 농장
COLOUR and TYPE: 하늘색·풀색 바탕, 헛간 빨강과 해 노랑 포인트 / Jua
LAYOUT: 화면 전체가 농장, 아래 직각 버튼 줄, 직각 패널. 모서리는 어디에도 둥글리지 않음
*/
:root{color-scheme:light dark;--sky:light-dark(#8fd3f4,#20335a);--sky2:light-dark(#e3f6ff,#3b4c7a);--g1:light-dark(#84d064,#356f3d);--g2:light-dark(#5aae40,#285a30);--ink:#2b2118;--bar:light-dark(#fff8e7,#1c1a16);--paper:light-dark(#fff8e7,#22201a);--fg:light-dark(#2b2118,#f5ecd9);--line:light-dark(#2b2118,#f5ecd9);--scrim:light-dark(rgba(43,33,24,.5),rgba(0,0,0,.65));--muted:light-dark(#7a6a58,#bfb29c);--sea:#ff4f86;--jian:#1fa3e0;--hot:#ffd23f;--red:#e8453c;--ok:#3f9b3a}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;border-radius:0!important;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
textarea{user-select:text;-webkit-user-select:text}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:Jua,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--sky);color:var(--fg);display:flex;flex-direction:column;height:100%;touch-action:manipulation}
button{font:inherit;color:var(--ink)}
#stage{position:relative;flex:1;overflow:hidden;background:linear-gradient(var(--sky) 0,var(--sky2) 40%,var(--g1) 42%,var(--g2) 100%)}
svg{display:block;overflow:visible}
.anc{position:absolute;transform:translate(-50%,-100%)}
.anc>svg,.thing>svg{width:100%;height:auto}
.deco{pointer-events:none}.tap{cursor:pointer}
#hills{position:absolute;left:0;top:24%;width:100%;height:19%;pointer-events:none}
#fence{position:absolute;left:0;top:41.5%;width:100%;height:8%;pointer-events:none}
#sun{position:absolute;right:calc(4% + 54px);top:4%;width:clamp(60px,12vmin,104px);cursor:pointer}
#sun .rays{transform-origin:50px 50px;animation:turn 30s linear infinite}
#sun.spin{animation:hop .6s}
@keyframes turn{to{transform:rotate(360deg)}}
.cloud{position:absolute;width:clamp(80px,17vmin,160px);pointer-events:none;animation:drift 70s linear infinite}
@keyframes drift{from{transform:translateX(-35vw)}to{transform:translateX(135vw)}}
.bird{position:absolute;width:26px;pointer-events:none;animation:drift 40s linear infinite}
.bird path{animation:flap .5s ease-in-out infinite alternate;transform-origin:center;transform-box:fill-box}
@keyframes flap{to{transform:scaleY(.4)}}
#blades{transform-origin:60px 52px;animation:turn 9s linear infinite}
#mill.fast #blades{animation-duration:.8s}
#tree.shake{animation:shake .5s}
@keyframes shake{25%{transform:translate(-52%,-100%) rotate(-2deg)}75%{transform:translate(-48%,-100%) rotate(2deg)}}
.leaf{animation:sway 4s ease-in-out infinite alternate;transform-origin:80px 150px}
@keyframes sway{to{transform:rotate(1.2deg)}}
.dl,.dr{transition:transform .5s ease}
#barn.open .dl,#barn.open .dr{transform:scaleX(.12)}
#cat{transition:transform .5s ease .2s;transform:translateY(40px)}
#barn.open #cat{transform:translateY(0)}
#flag{transition:transform .5s cubic-bezier(.5,1.8,.5,1);transform-origin:63px 42px;transform:rotate(90deg)}
#mailbox.up #flag{transform:rotate(0)}
.thing{position:absolute;transform:translate(-50%,-100%);cursor:pointer;transition:left 1.1s ease-in-out,top 1.1s ease-in-out}
.animal{width:clamp(70px,16vmin,148px)}
.kid{width:clamp(54px,12vmin,104px)}
.sh{fill:rgba(30,40,10,.18)}
.eye{animation:blink 4.6s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.tail{animation:wag 1.6s ease-in-out infinite alternate;transform-box:fill-box}
@keyframes wag{from{transform:rotate(-10deg)}to{transform:rotate(10deg)}}
.breath{animation:breath 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
@keyframes breath{50%{transform:scaleY(1.03)}}
.ear{animation:ear 5s ease-in-out infinite;transform-box:fill-box}
@keyframes ear{0%,88%,100%{transform:rotate(0)}93%{transform:rotate(-14deg)}}
.kid .flip{transition:transform .2s;transform-box:fill-box;transform-origin:center}
.kid.left .flip{transform:scaleX(-1)}
.kid.mine::after{content:"";position:absolute;left:50%;top:-16px;width:14px;height:14px;background:var(--hot);transform:translateX(-50%) rotate(45deg);border:2px solid var(--ink);animation:hop 1.2s infinite}
.kid.walk svg{animation:bob .22s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-5%)}}
.hop>svg{animation:hop .5s ease;transform-origin:bottom}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-20%) scaleY(1.05)}70%{transform:translateY(0) scaleY(.93)}}
.munch>svg{animation:munch .16s ease 5 alternate;transform-origin:bottom}
@keyframes munch{to{transform:scale(1.05,.95)}}
.spinf{animation:spinf .7s ease}
@keyframes spinf{50%{transform:translate(-50%,-100%) rotate(180deg) scale(1.4)}100%{transform:translate(-50%,-100%) rotate(360deg)}}
.bubble{position:absolute;transform:translate(-50%,-100%);background:#fff;color:var(--ink);border:3px solid var(--ink);padding:4px 12px;font-size:clamp(20px,4.5vmin,34px);white-space:nowrap;pointer-events:none;z-index:200;animation:pop 1.5s ease forwards}
@keyframes pop{0%{opacity:0;margin-top:10px}15%{opacity:1;margin-top:0}80%{opacity:1}100%{opacity:0;margin-top:-14px}}
.fx{position:absolute;pointer-events:none;z-index:150;transform:translate(-50%,-50%)}
.heart{width:34px;animation:float 1.3s ease-out forwards}
.spark{width:28px;animation:float 1s ease-out forwards}
@keyframes float{from{opacity:1;transform:translate(-50%,0) scale(.6)}to{opacity:0;transform:translate(calc(-50% + var(--dx)),-110px) scale(1.2)}}
.ripple{width:90px;animation:rip 1s ease-out forwards}
@keyframes rip{from{opacity:.9;transform:translate(-50%,-50%) scale(.2)}to{opacity:0;transform:translate(-50%,-50%) scale(1.6)}}
.fish{width:46px;animation:jump 1.1s ease-in-out forwards}
@keyframes jump{0%{transform:translate(-50%,0) rotate(-40deg);opacity:0}15%{opacity:1}50%{transform:translate(-10%,-90px) rotate(10deg)}100%{transform:translate(30%,0) rotate(70deg);opacity:0}}
.pick{position:absolute;transform:translate(-50%,-100%);cursor:pointer;z-index:120}
.egg{width:clamp(30px,6vmin,46px);animation:lay .4s ease}
.apple{width:clamp(28px,5.5vmin,42px);animation:fall .7s cubic-bezier(.5,0,1,1)}
@keyframes lay{from{transform:translate(-50%,-100%) scale(0)}}
@keyframes fall{from{margin-top:calc(-1 * var(--h))}80%{margin-top:0}90%{margin-top:-10px}}
.got{transition:all .6s ease-in;left:12%!important;top:4%!important;opacity:0}
.fly{position:absolute;width:34px;cursor:pointer;z-index:110}
.fly .w{animation:wing .18s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes wing{to{transform:scaleX(.25)}}
.mbadge{position:absolute;right:-6px;top:-6px;background:var(--red);color:#fff;font-size:16px;min-width:26px;height:26px;line-height:22px;text-align:center;border:2px solid var(--ink);pointer-events:none}

#bar{display:flex;gap:8px;align-items:stretch;padding:8px max(8px,env(safe-area-inset-left,0px)) 8px max(8px,env(safe-area-inset-right,0px));background:var(--bar);border-top:4px solid var(--ink);overflow-x:auto;flex:none}
.btn{flex:none;width:64px;height:64px;border:3px solid var(--ink);background:#fff;padding:4px;cursor:pointer;display:grid;place-items:center;position:relative}
.btn svg{width:100%;height:100%}
.btn.on{background:var(--hot);transform:translateY(-4px);box-shadow:0 4px 0 var(--ink)}
.btn.off{opacity:.4}
.btn:focus-visible,.ib:focus-visible,.txtbtn:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.btn .badge{position:absolute;right:-3px;top:-3px;background:var(--red);color:#fff;font-size:14px;min-width:22px;height:22px;line-height:20px;text-align:center;border:2px solid var(--ink)}
.sep{flex:none;width:3px;background:var(--line);opacity:.25;margin:4px 2px}
#counts{position:absolute;left:max(8px,env(safe-area-inset-left,0px));top:8px;display:flex;gap:2px;background:#fff;border:3px solid var(--ink);z-index:250;color:var(--ink)}
.count{display:flex;align-items:center;gap:3px;font-size:24px;padding:0 6px}
.count svg{width:30px;height:30px}
.count.bump{animation:hop .4s}
#momzone{position:absolute;right:env(safe-area-inset-right,0px);top:0;width:58px;height:58px;z-index:300;display:grid;place-items:center;touch-action:none}
#momzone svg{width:34px;height:34px;opacity:.35}
#momzone.hold svg{opacity:1}
#momzone .ring{transform:rotate(-90deg);transform-origin:20px 20px}
#momzone.hold .ring{animation:fillring 3s linear forwards}
@keyframes fillring{to{stroke-dashoffset:0}}

/* 오버레이 */
.ov{position:fixed;inset:0;z-index:1000;background:var(--paper);color:var(--fg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ov.center{align-items:center;justify-content:center;background:var(--scrim);padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.ovtop{display:flex;gap:8px;align-items:center;padding:8px max(10px,env(safe-area-inset-right,0px)) 8px max(10px,env(safe-area-inset-left,0px));border-bottom:4px solid var(--ink);background:var(--bar);flex:none}
.ovbody{flex:1;overflow:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.box{background:var(--paper);color:var(--fg);border:4px solid var(--line);box-shadow:6px 6px 0 var(--ink);padding:16px;width:min(560px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.ib{flex:none;width:var(--b,52px);height:var(--b,52px);border:3px solid var(--ink);background:#fff;padding:5px;cursor:pointer;display:grid;place-items:center;position:relative}
.ib svg{width:100%;height:100%}
.ib.on{background:var(--hot);box-shadow:0 0 0 3px var(--line)}
.ib.sw.on{box-shadow:inset 0 0 0 5px #fff,inset 0 0 0 8px var(--ink),0 0 0 3px var(--line)}
.ib.armed{background:#ffd0cc;animation:hop .4s}
.ib.big{--b:76px}
.ib[disabled]{opacity:.4}
.txtbtn{border:3px solid var(--ink);background:#fff;padding:10px 14px;font-size:18px;cursor:pointer;min-height:48px}
.txtbtn.primary{background:var(--hot)}
.txtbtn.warn{background:#ffd0cc}
.txtbtn[disabled]{opacity:.45;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.card{border:3px solid var(--ink);background:#fff;padding:6px;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:4px}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;border:2px solid var(--ink);background:#fff}
.card .who{position:absolute;left:-8px;top:-10px;width:44px;height:44px;background:#fff;border:3px solid var(--ink)}
.card .done{position:absolute;right:-8px;top:-10px;width:36px;height:36px;background:var(--ok);border:3px solid var(--ink)}
.empty{display:grid;place-items:center;gap:10px;padding:40px 12px;color:var(--muted);text-align:center;font-size:18px}
.empty svg{width:120px;opacity:.8}

/* 고르기 */
.pickrow{display:flex;gap:clamp(16px,5vw,48px);flex-wrap:wrap;justify-content:center}
.bigkid{width:clamp(130px,36vmin,240px);border:4px solid var(--ink);background:#fff;padding:12px 12px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:clamp(24px,5vmin,36px);box-shadow:6px 6px 0 var(--ink)}
.bigkid svg{width:100%}
.bigkid:active{transform:translate(3px,3px);box-shadow:3px 3px 0 var(--ink)}

/* 옷장 */
.wcard{border:3px solid var(--ink);background:#fff;padding:8px;cursor:pointer;display:grid;place-items:center}
.wcard svg{height:clamp(120px,26vmin,190px);width:auto}
.wcard.on{background:var(--hot);box-shadow:0 0 0 4px var(--line)}
.swrow{display:flex;gap:8px;flex-wrap:wrap;padding-top:14px}
.swrow button{width:48px;height:48px;border:3px solid var(--ink);cursor:pointer;padding:0}
.swrow button.on{box-shadow:inset 0 0 0 5px #fff,0 0 0 3px var(--line)}

/* 그림판 */
#ov-easel{display:grid;grid-template-rows:1fr auto;grid-template-columns:100%}
#pw{position:relative;display:grid;place-items:center;overflow:hidden;background:repeating-linear-gradient(45deg,var(--paper) 0 14px,var(--bar) 14px 28px)}
#paper{position:relative;background:#fff;border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);touch-action:none;cursor:crosshair}
#paper canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#paper canvas.mine{z-index:2}
.L-sea{filter:drop-shadow(0 0 1.3px var(--sea)) drop-shadow(0 0 1.3px var(--sea))}
.L-jian{filter:drop-shadow(0 0 1.3px var(--jian)) drop-shadow(0 0 1.3px var(--jian))}
#pcur{position:absolute;width:40px;height:40px;transform:translate(-50%,-110%);z-index:5;pointer-events:none;transition:left .08s linear,top .08s linear;background:#fff;border:3px solid var(--ink)}
#etools{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:8px max(8px,env(safe-area-inset-right,0px)) 8px max(8px,env(safe-area-inset-left,0px));background:var(--bar);border-top:4px solid var(--ink)}
#etools .ib{--b:46px}
#etools .gap{width:3px;align-self:stretch;background:var(--line);opacity:.25}
.partner{background:#fff;animation:hop 1.4s infinite}
@media (orientation:landscape) and (min-width:600px){
 #ov-easel{grid-template-rows:100%;grid-template-columns:auto 1fr}
 #etools{order:-1;display:grid;grid-template-columns:repeat(2,46px);align-content:start;border-top:0;border-right:4px solid var(--ink);overflow-y:auto;padding:8px 8px 8px max(8px,env(safe-area-inset-left,0px))}
 #etools .gap{display:none}
}
@media (orientation:landscape) and (min-width:600px) and (max-height:520px){#etools{grid-template-columns:repeat(3,42px)}#etools .ib{--b:42px}}

/* 편지 */
.lrow{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.lrow img{width:min(260px,100%);border:3px solid var(--ink);background:#fff}
#ltext,#pmsg{width:100%;min-height:96px;font:inherit;font-size:22px;padding:10px;border:3px solid var(--ink);background:#fff;color:var(--ink);resize:vertical}
#lpart{color:var(--muted);font-size:20px;min-height:1.3em}
.mic.on{background:#ffd0cc;animation:hop 1s infinite}
.fly-env{position:fixed;z-index:2000;width:80px;pointer-events:none;animation:envfly 1.2s ease-in forwards}
@keyframes envfly{0%{transform:translate(-50%,-50%) scale(1.4)}60%{transform:translate(-50%,-50%) scale(1)}100%{transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(.3);opacity:.2}}

/* 엄마 */
.gate{width:min(380px,100%);align-items:center;text-align:center}
.gq{font-size:40px;margin:0}
.ga{font-size:34px;min-height:44px;min-width:120px;border-bottom:4px solid var(--line);margin:0}
.keys{display:grid;grid-template-columns:repeat(3,72px);gap:8px}
.keys button{height:60px;border:3px solid var(--ink);background:#fff;font-size:28px;cursor:pointer}
.shakex{animation:shx .4s}
@keyframes shx{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.mom h2{margin:0;font-size:26px;font-weight:400}
.mom h3{margin:8px 0 0;font-size:20px;font-weight:400;border-bottom:3px solid var(--line);padding-bottom:4px}
.mom p{margin:0;line-height:1.5;font-size:16px;color:var(--muted)}
.mrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.kidbtn{display:flex;align-items:center;gap:6px}
.kidbtn svg{width:36px;height:36px}
.kidbtn.on{background:var(--hot)}
.litem{display:grid;grid-template-columns:110px 1fr;gap:10px;border:3px solid var(--line);padding:8px;background:var(--bar)}
.litem img{width:110px;aspect-ratio:4/3;object-fit:cover;border:2px solid var(--ink);background:#fff}
.litem .meta{font-size:15px;color:var(--muted)}
.litem .tx{font-size:18px;word-break:break-word;white-space:pre-wrap}
.litem .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.status{font-size:16px;line-height:1.5;min-height:1.5em}
.status.bad{color:var(--red)}.status.good{color:var(--ok)}
.cnt{font-size:15px;color:var(--muted);text-align:right}
.cnt.over{color:var(--red)}
#vimg{width:min(720px,100%);border:4px solid var(--ink);background:#fff}
#vtext{font-size:24px;margin:0;white-space:pre-wrap;word-break:break-word}
@media(max-width:420px){.btn{width:54px;height:54px}#bar{gap:6px}.count{font-size:20px}.count svg{width:24px;height:24px}.grid{grid-template-columns:repeat(2,1fr)}.litem{grid-template-columns:84px 1fr}.litem img{width:84px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

let pen={c:ECOL[1],w:1,erase:false},cur=null,pend=[],flushT=0,armed=false,armT=0,partner=null;
const saveT={};function saveLayer(id){clearTimeout(saveT[id]);saveT[id]=setTimeout(()=>{try{localStorage.setItem('easel_'+id,layers[id].c.toDataURL('image/png'))}catch(e){}},700)}
function drawSeg(kid,c,w,p){const L=layers[kid];if(!L)return;const x=L.x,sx=EW/10000,sy=EH/10000,lw=WID[w]*(c==='E'?2:1);
 x.save();x.globalCompositeOperation=c==='E'?'destination-out':'source-over';x.strokeStyle=x.fillStyle=c==='E'?'#000':c;x.lineWidth=lw;x.lineCap='round';x.lineJoin='round';
 if(p.length===2){x.beginPath();x.arc(p[0]*sx,p[1]*sy,lw/2,0,Math.PI*2);x.fill()}else{x.beginPath();x.moveTo(p[0]*sx,p[1]*sy);for(let i=2;i<p.length;i+=2)x.lineTo(p[i]*sx,p[i+1]*sy);x.stroke()}x.restore()}
function remoteSeg(d){if(!d||!KN[d.k]||!(d.c==='E'||okHex(d.c))||![0,1,2].includes(d.w)||!Array.isArray(d.p)||d.p.length<2||d.p.length>600||d.p.length%2)return;
 if(!d.p.every(v=>typeof v==='number'&&v>=0&&v<=10000))return;drawSeg(d.k,d.c,d.w,d.p);saveLayer(d.k)}
function nrm(e){const r=paper.getBoundingClientRect();return[Math.round(Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*10000),Math.round(Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))*10000)]}
function flush(){clearTimeout(flushT);flushT=0;if(!cur)return;if(pend.length>2||(!cur.sent&&pend.length===2)){eRoom&&eRoom.emit('seg',{k:myKid,c:cur.c,w:cur.w,p:pend}).catch(()=>{});cur.sent=true}pend=cur.last.slice()}
paper.addEventListener('pointerdown',e=>{if(!myKid)return;e.preventDefault();try{paper.setPointerCapture(e.pointerId)}catch(_){}const p=nrm(e);cur={c:pen.erase?'E':pen.c,w:pen.w,last:p,sent:false,id:e.pointerId};pend=p.slice();drawSeg(myKid,cur.c,cur.w,p);flushT=setTimeout(flush,45)});
paper.addEventListener('pointermove',e=>{if(!cur||e.pointerId!==cur.id)return;const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const ev of (evs.length?evs:[e])){const p=nrm(ev);drawSeg(myKid,cur.c,cur.w,[...cur.last,...p]);cur.last=p;pend.push(p[0],p[1]);if(pend.length>=280)flush()}
 if(!flushT)flushT=setTimeout(flush,45);if(eRoom)eRoom.presence({kid:myKid,open:true,x:cur.last[0],y:cur.last[1]}).catch(()=>{})});
const endStroke=e=>{if(!cur||e.pointerId!==cur.id)return;flush();cur=null;saveLayer(myKid)};
paper.addEventListener('pointerup',endStroke);paper.addEventListener('pointercancel',endStroke);
function clearLayers(){Object.keys(layers).forEach(id=>{layers[id].x.clearRect(0,0,EW,EH);try{localStorage.removeItem('easel_'+id)}catch(e){}})}
function fitPaper(){const r=pw.getBoundingClientRect();let w=r.width-24,h=r.height-24;if(w<=0||h<=0)return;if(w/h>4/3)w=h*4/3;else h=w*.75;paper.style.width=Math.floor(w)+'px';paper.style.height=Math.floor(h)+'px'}
addEventListener('resize',()=>{if(!$('ov-easel').hidden)fitPaper()});
function presenceEasel(open){if(eRoom&&myKid)eRoom.presence({kid:myKid,open:!!open}).catch(()=>{})}
function onEaselPeers(ch){partner=null;for(const p of ch.peers){if(p.sameTab||p.kind!=='viewer')continue;const s=p.presence||{};if(s.open&&KN[s.kid]&&s.kid!==myKid){partner=s;break}}
 const pc=$('pcur');if(partner&&isFinite(+partner.x)&&isFinite(+partner.y)&&partner.x!=null){pc.hidden=false;pc.innerHTML=faceSvg(KIDS.find(k=>k.id===partner.kid));pc.style.left=(+partner.x/100)+'%';pc.style.top=(+partner.y/100)+'%'}else pc.hidden=true;
 const ps=$('partner');if(ps){ps.hidden=!partner;if(partner)ps.innerHTML=faceSvg(KIDS.find(k=>k.id===partner.kid))}}
function renderTools(){
 et.innerHTML=`<button class="ib" data-e="home" aria-label="농장으로">${ICON.home}</button><span class="gap"></span>`
 +ECOL.map(c=>`<button class="ib sw${!pen.erase&&pen.c===c?' on':''}" data-e="c" data-c="${c}" style="background:${c}" aria-label="색"></button>`).join('')+'<span class="gap"></span>'
 +WID.map((w,i)=>`<button class="ib${pen.w===i?' on':''}" data-e="w" data-w="${i}" aria-label="굵기"><svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="${[5,10,17][i]}" fill="${pen.erase?'#fff':pen.c}" ${S2}/></svg></button>`).join('')
 +`<button class="ib${pen.erase?' on':''}" data-e="erase" aria-label="지우개">${ICON.eraser}</button><button class="ib${armed?' armed':''}" data-e="clear" aria-label="전체 지우기">${armed?ICON.check:ICON.trash}</button><span class="gap"></span>`
 +`<button class="ib" data-e="save" aria-label="저장">${ICON.save}</button><button class="ib" data-e="gallery" aria-label="저장한 그림">${ICON.gallery}</button><button class="ib" data-e="letter" aria-label="편지 쓰기">${ICON.letter}</button>`
 +`<span class="ib partner" id="partner" ${partner?'':'hidden'}>${partner?faceSvg(KIDS.find(k=>k.id===partner.kid)):''}</span>`}
et.addEventListener('click',e=>{const b=e.target.closest('[data-e]');if(!b)return;const a=b.dataset.e;beep(700,.06);
 if(a==='home'){hide('ov-easel');presenceEasel(false);return}
 if(a==='c'){pen.c=b.dataset.c;pen.erase=false}
 else if(a==='w')pen.w=+b.dataset.w;
 else if(a==='erase')pen.erase=!pen.erase;
 else if(a==='clear'){if(!armed){armed=true;clearTimeout(armT);armT=setTimeout(()=>{armed=false;renderTools()},2500)}else{armed=false;clearLayers();eRoom&&eRoom.emit('clr',{k:myKid}).catch(()=>{});beep(300,.25,'triangle',120)}}
 else if(a==='save'){saveDrawing();return}
 else if(a==='gallery'){openGallery();return}
 else if(a==='letter'){openLetter();return}
 renderTools()});
function openEasel(){if(!myKid)return;renderTools();show('ov-easel');requestAnimationFrame(fitPaper);presenceEasel(true);speak('그림 그리자!')}
function composite(w=480){const h=Math.round(w*.75),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);['jian','sea'].forEach(id=>x.drawImage(layers[id].c,0,0,w,h));return c.toDataURL('image/jpeg',.78)}

/* ===== 저장소 (db, 없으면 이 기기) ===== */
let db=null,letters=[],drawings=[],isOwner=false,mcp=null;
const LOCAL={letters:'farmLetters',drawings:'farmDrawings'};
function clean(id,d){if(!d||!KN[d.kid]||!okImg(d.img))return null;return{id,kid:d.kid,img:d.img,text:typeof d.text==='string'?d.text.slice(0,200):'',at:+d.at||0,sent:!!d.sent}}
function loadLocal(){letters=(LS.get(LOCAL.letters,[])||[]).map(d=>clean(d.id,d)).filter(Boolean);drawings=(LS.get(LOCAL.drawings,[])||[]).map(d=>clean(d.id,d)).filter(Boolean);refreshAll()}
async function addDoc(col,d){if(db){await db.collection(col).add(d);return}
 const arr=col==='letters'?letters:drawings;arr.unshift({id:'l'+Date.now(),...d});while(arr.length>12)arr.pop();
 if(!LS.set(LOCAL[col],arr)&&arr.length>1){arr.pop();LS.set(LOCAL[col],arr)}refreshAll();if(col==='drawings'&&!$('ov-gallery').hidden)renderGallery()}
async function updDoc(col,id,patch){if(db){await db.doc(col+'/'+id).update(patch);return}const arr=col==='letters'?letters:drawings;const L=arr.find(x=>x.id===id);if(L)Object.assign(L,patch);LS.set(LOCAL[col],arr);refreshAll()}
async function delDoc(col,id){if(db){await db.doc(col+'/'+id).delete();return}const arr=col==='letters'?letters:drawings;const i=arr.findIndex(x=>x.id===id);if(i>=0)arr.splice(i,1);LS.set(LOCAL[col],arr);refreshAll()}
use('db').then(d=>{if(!d){loadLocal();return}db=d;
 d.collection('letters').orderBy('at','desc').limit(40).onSnapshot(s=>{letters=s.docs.map(x=>clean(x.id,x.data())).filter(Boolean);refreshAll()},()=>{});
 d.collection('drawings').orderBy('at','desc').limit(30).onSnapshot(s=>{drawings=s.docs.map(x=>clean(x.id,x.data())).filter(Boolean);if(!$('ov-gallery').hidden)renderGallery()},()=>{})});
use('user').then(u=>u&&u.isOwner()).then(v=>{isOwner=!!v;if(!$('ov-mom').hidden)renderMom()}).catch(()=>{});
use('mcp').then(m=>{mcp=m;if(!$('ov-mom').hidden)renderMom()});
function refreshAll(){const unsent=letters.filter(l=>!l.sent).length;mailbox.classList.toggle('up',letters.length>0);mbadge.hidden=!letters.length;mbadge.textContent=letters.length;renderBar();if(!$('ov-mail').hidden)renderMail();if(!$('ov-mom').hidden)renderMom()}

async function saveDrawing(){const b=et.querySelector('[data-e=save]');if(b)b.disabled=true;
 try{await addDoc('drawings',{kid:myKid,img:composite(480),at:Date.now()});tune();speak('그림 저장!');if(b){hop(b);b.classList.add('on')}}
 catch(e){beep(200,.3,'square');if(b)b.classList.add('shakex')}
 setTimeout(()=>{if(b){b.disabled=false;b.classList.remove('on','shakex')}},900)}

/* 갤러리 */
const EMPTY_FRAME=`<svg viewBox="0 0 60 60">${ICON.gallery.replace(/<svg[^>]*>|<\/svg>/g,'')}</svg>`;
function card(L,withDone){const b=document.createElement('button');b.className='card';const im=document.createElement('img');im.src=L.img;im.alt='그림';b.appendChild(im);
 const w=document.createElement('span');w.className='who';w.innerHTML=faceSvg(KIDS.find(k=>k.id===L.kid));b.appendChild(w);
 if(withDone&&L.sent){const d=document.createElement('span');d.className='done';d.innerHTML=ICON.sent;b.appendChild(d)}
 b.addEventListener('click',()=>openView(L));return b}
function renderGrid(el,arr,withDone,emptyIcon){el.replaceChildren();if(!arr.length){const e=document.createElement('div');e.className='empty';e.style.gridColumn='1/-1';e.innerHTML=emptyIcon;el.appendChild(e);return}arr.forEach(L=>el.appendChild(card(L,withDone)))}
function openGallery(){renderGallery();show('ov-gallery')}
function renderGallery(){renderGrid($('ggrid'),drawings,false,EMPTY_FRAME)}
function openView(L){$('vimg').src=L.img;$('vtext').textContent=L.text||'';$('vsay').hidden=!L.text;$('vsay').onclick=()=>speak(L.text);show('ov-view');if(L.text)speak(L.text)}
$('vsay').innerHTML=ICON.speaker;

/* ===== 편지 ===== */
let letterImg='',dict=null,listening=false;
$('lmic').innerHTML=ICON.mic;$('lpost').innerHTML=ICON.post;
function openLetter(){letterImg=composite(480);$('limg').src=letterImg;$('ltext').value='';$('lpart').textContent='';$('lwho').innerHTML=faceSvg(me());$('lpost').disabled=false;show('ov-letter');speak('하고 싶은 말을 해 봐!')}
use('dictation').then(d=>{dict=d;if(!d)return;$('lmic').hidden=false;
 d.onPartial(({text})=>{$('lpart').textContent=text});
 d.onFinal(({text})=>{const ta=$('ltext');const t=ta.value?text:text.replace(/^\s+/,'');ta.value=(ta.value+t).slice(0,120);$('lpart').textContent=''});
 d.onState(({state})=>{listening=state!=='idle';$('lmic').classList.toggle('on',listening);if(!listening)$('lpart').textContent=''})});
$('lmic').addEventListener('click',()=>{if(!dict)return;if(listening){dict.stop().catch(()=>{});return}dict.start().catch(e=>{if(e&&e.code==='not_granted')$('lmic').hidden=true})});
$('lpost').addEventListener('click',async()=>{const b=$('lpost');if(b.disabled)return;b.disabled=true;if(listening&&dict)await dict.stop().catch(()=>{});
 try{await addDoc('letters',{kid:myKid,text:$('ltext').value.trim().slice(0,120),img:letterImg,at:Date.now(),sent:false});
  const r=b.getBoundingClientRect(),m=mailbox.getBoundingClientRect(),env=document.createElement('div');env.className='fly-env';env.innerHTML=ICON.letter;env.style.left=(r.left+r.width/2)+'px';env.style.top=(r.top+r.height/2)+'px';
  hide('ov-letter');hide('ov-easel');presenceEasel(false);env.style.setProperty('--tx',(m.left+m.width/2-r.left-r.width/2)+'px');env.style.setProperty('--ty',(m.top+m.height*.3-r.top-r.height/2)+'px');document.body.appendChild(env);
  setTimeout(()=>{env.remove();hop(mailbox);sparkle(mailbox);tune();speak('우체통에 쏙!')},1200)}
 catch(e){b.disabled=false;b.classList.add('shakex');beep(200,.3,'square');setTimeout(()=>b.classList.remove('shakex'),500)}});

/* 우체통 (아이) */
const EMPTY_MAIL=`<svg viewBox="0 0 60 60">${ICON.letter.replace(/<svg[^>]*>|<\/svg>/g,'')}</svg>`;
function openMail(){renderMail();show('ov-mail')}
function renderMail(){renderGrid($('mgrid'),letters,true,EMPTY_MAIL)}

/* ===== 엄마 잠금 해제: 오른쪽 위 3초 길게 + 곱셈 ===== */
const mz=$('momzone');let mzT=0;
const mzOff=()=>{clearTimeout(mzT);mz.classList.remove('hold')};
mz.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();mz.classList.add('hold');mzT=setTimeout(()=>{mzOff();openGate(openMom)},3000)});
['pointerup','pointerleave','pointercancel'].forEach(t=>mz.addEventListener(t,mzOff));
mz.addEventListener('click',e=>e.stopPropagation());mz.addEventListener('contextmenu',e=>e.preventDefault());
let gAns=0,gIn='',gFails=0,gNext=null;
$('keys').innerHTML=[1,2,3,4,5,6,7,8,9,'←',0,'확인'].map(v=>`<button data-k="${v}">${v}</button>`).join('');
function newQ(){const a=3+Math.floor(Math.random()*7),b=3+Math.floor(Math.random()*7);gAns=a*b;gIn='';$('gq').textContent=`${a} × ${b} = ?`;$('ga').textContent=''}
function openGate(next){gNext=next;gFails=0;newQ();show('ov-gate')}
$('keys').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;const k=b.dataset.k;
 if(k==='←')gIn=gIn.slice(0,-1);else if(k==='확인'){if(+gIn===gAns&&gIn){hide('ov-gate');gNext&&gNext();return}gFails++;$('gbox').classList.remove('shakex');void $('gbox').offsetWidth;$('gbox').classList.add('shakex');beep(200,.3,'square');if(gFails>=2){hide('ov-gate');return}newQ();return}
 else if(gIn.length<3)gIn+=k;$('ga').textContent=gIn});
$('gx').addEventListener('click',()=>hide('ov-gate'));

/* 엄마 메뉴 */
function openMom(){renderMom();show('ov-mom')}
$('momx').addEventListener('click',()=>hide('ov-mom'));
const fmt=t=>{const d=new Date(t);const p=n=>String(n).padStart(2,'0');return`${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`};
function renderMom(){
 const mk=$('momkids');mk.replaceChildren();KIDS.forEach(k=>{const b=document.createElement('button');b.className='txtbtn kidbtn'+(k.id===myKid?' on':'');b.innerHTML=faceSvg(k);b.appendChild(document.createTextNode(k.name));b.addEventListener('click',()=>{setKid(k.id);renderMom();tune()});mk.appendChild(b)});
 const canSend=isOwner&&!!mcp;
 $('momnote').textContent=!isOwner?'카카오톡 보내기는 엄마 계정으로 이 농장을 열었을 때만 돼요.':!mcp?'이 화면에서는 카카오톡 연결을 쓸 수 없어요. claude.ai에서 열어 주세요.':'보내기를 누르면 먼저 미리보기가 나와요. PlayMCP 커넥터의 ‘나와의 채팅’으로 글만 보내져요.';
 const list=$('momlist');list.replaceChildren();
 if(!letters.length){const p=document.createElement('p');p.textContent='아직 편지가 없어요. 아이가 그림판에서 편지 버튼을 누르면 여기에 쌓여요.';list.appendChild(p);return}
 letters.forEach(L=>{const it=document.createElement('div');it.className='litem';
  const im=document.createElement('img');im.src=L.img;im.alt='편지 그림';it.appendChild(im);
  const t=document.createElement('div');const m=document.createElement('div');m.className='meta';m.textContent=`${KN[L.kid]} · ${fmt(L.at)} · ${L.sent?'카톡 보냄':'아직 안 보냄'}`;const tx=document.createElement('div');tx.className='tx';tx.textContent=L.text||'(글 없이 그림만)';t.append(m,tx);it.appendChild(t);
  const acts=document.createElement('div');acts.className='acts';
  const sb=document.createElement('button');sb.className='txtbtn primary';sb.textContent=L.sent?'카톡으로 다시 보내기':'카톡으로 보내기';sb.disabled=!canSend;sb.addEventListener('click',()=>openPreview(L));
  const db2=document.createElement('button');db2.className='txtbtn';db2.textContent='지우기';let arm=0;
  db2.addEventListener('click',async()=>{if(!arm){arm=setTimeout(()=>{arm=0;db2.textContent='지우기';db2.classList.remove('warn')},3000);db2.textContent='한 번 더 누르면 지워요';db2.classList.add('warn');return}clearTimeout(arm);db2.disabled=true;try{await delDoc('letters',L.id)}catch(e){db2.disabled=false;db2.textContent='못 지웠어요'}});
  acts.append(sb,db2);it.appendChild(acts);list.appendChild(it)})}

/* 카톡 미리보기 → 보내기 */
let pL=null,sending=false;
const cp=s=>Array.from(s).length;
function kakaoText(L){const body=(L.text||'').trim()||'(그림만 그린 편지예요)';const head=`💌 ${KN[L.kid]}의 편지 (${fmt(L.at)})\n`,tail='\n- 동물농장 우체통에서';return Array.from(head+body+tail).slice(0,200).join('')}
function openPreview(L){pL=L;$('pimg').src=L.img;$('pmsg').value=kakaoText(L);$('pstat').textContent='';$('pstat').className='status';$('psend').disabled=false;$('psend').textContent='카카오톡으로 보내기';updCnt();show('ov-prev')}
function updCnt(){const n=cp($('pmsg').value);$('pcnt').textContent=`${n} / 200자`;$('pcnt').classList.toggle('over',n>200);if(!sending)$('psend').disabled=n>200||!$('pmsg').value.trim()}
$('pmsg').addEventListener('input',updCnt);
$('pcancel').addEventListener('click',()=>{if(!sending)hide('ov-prev')});
function stat(t,cls){const s=$('pstat');s.textContent=t;s.className='status '+(cls||'')}
$('psend').addEventListener('click',async()=>{if(sending||!pL)return;const msg=$('pmsg').value.trim();if(!msg||cp(msg)>200)return;
 if(!mcp){stat('이 화면에서는 카카오톡 연결을 쓸 수 없어요.','bad');return}
 sending=true;$('psend').disabled=true;$('pcancel').disabled=true;stat('보내는 중…');
 try{await mcp.callTool('PlayMCP','KakaotalkChat-MemoChat',{message:msg});
  stat('보냈어요. 카카오톡 ‘나와의 채팅’을 확인해 보세요.','good');$('psend').textContent='보냈어요';
  updDoc('letters',pL.id,{sent:true,sentAt:Date.now()}).catch(()=>{})}
 catch(e){const c=e&&e.code;$('psend').disabled=false;
  const M={server_not_connected:'PlayMCP 커넥터가 연결돼 있지 않아요. claude.ai 설정 → 커넥터에서 PlayMCP를 추가해 주세요.',needs_reauth:'PlayMCP 연결이 만료됐어요. claude.ai 설정 → 커넥터에서 다시 연결해 주세요.',selection_required:'같은 이름의 커넥터가 여러 개예요. 화면에 뜬 선택 창에서 하나를 골라 주세요.',approval_required:'이 농장이 카카오톡을 쓰려면 허용이 필요해요. 다시 눌러서 허용해 주세요.',not_in_manifest:'이 농장에서 PlayMCP 사용이 꺼져 있어요. 아티팩트의 권한 메뉴에서 켜 주세요.',blocked_by_policy:'조직 정책 때문에 이 도구를 쓸 수 없어요.',tool_error:'카카오톡이 보내기를 거절했어요. 카카오 로그인 상태를 확인해 주세요.',server_unavailable:'카카오톡 서버 응답이 없어요. 이미 갔을 수도 있으니 카톡을 먼저 확인하고 다시 보내 주세요.',upstream_error:'보내졌는지 확실하지 않아요. 카톡을 먼저 확인하고 다시 보내 주세요.'};
  stat(M[c]||'보내지 못했어요. 잠시 뒤에 다시 해 주세요.','bad')}
 finally{sending=false;$('pcancel').disabled=false}});

/* ===== 시작 ===== */
renderBar();
if(myKid)setKid(myKid);else{renderPick();show('ov-pick')}
}
</script>
